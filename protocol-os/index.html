<style>
/* ============ PROTOCOL OS — Design System ============ */
:root{
  --bg:#000000;
  --bg2:#0a0a0c;
  --card:#131316;
  --card2:#1a1a1f;
  --border:#232329;
  --border2:#2e2e36;
  --text:#e8e8ea;
  --muted:#8a8a92;
  --faint:#5a5a63;
  --accent:#3ddc97;
  --accent-dim:rgba(61,220,151,.13);
  --accent-glow:rgba(61,220,151,.25);
  --warn:#ffb454;
  --danger:#ff5c5c;
  --blue:#5aa7ff;
  --purple:#b48aff;
  --indigo:#8a93ff;
  --tag-routine:#8a8a92;
  --tag-sport:#3ddc97;
  --tag-study:#5aa7ff;
  --tag-food:#ffb454;
  --tag-care:#b48aff;
  --tag-sleep:#8a93ff;
  --nav-h:62px;
  --radius:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--accent-dim)}
.num{font-variant-numeric:tabular-nums}

/* ===== App shell ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
#screen::-webkit-scrollbar{width:4px}
#screen::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.tabview{display:none;min-height:100%}
.tabview.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Bottom nav ===== */
#nav{
  position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(10,10,12,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  display:flex;z-index:60;
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);transition:color .15s;position:relative}
.nav-btn svg{width:23px;height:23px}
.nav-btn span{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-badge{position:absolute;top:6px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--bg2);display:none}
.nav-badge.on{display:block;animation:pulseDot 1.6s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== Header ===== */
.hdr{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;background:var(--bg);position:sticky;top:0;z-index:40}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hdr-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.daynav-center{flex:1;text-align:center;min-width:0}
.daynav-date{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daynav-accent{font-size:12px;color:var(--accent);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow-btn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;transition:.15s}
.arrow-btn:active{background:var(--card2);color:var(--text);transform:scale(.94)}
.today-pill{margin:8px auto 0;display:none;width:fit-content;padding:7px 16px;border-radius:999px;background:var(--accent-dim);border:1px solid var(--accent-glow);color:var(--accent);font-size:12.5px;font-weight:700}
.today-pill.show{display:block}
.today-pill:active{transform:scale(.96)}

/* ===== Timeline ===== */
.timeline-wrap{position:relative;padding:6px 14px 30px}
.timeline{position:relative;margin-left:52px}
.hour-lab{position:absolute;left:-52px;width:44px;text-align:right;font-size:11px;color:var(--faint);font-weight:600;transform:translateY(-6px)}
.hour-line{position:absolute;left:0;right:0;height:1px;background:var(--border);opacity:.5}
.now-line{position:absolute;left:-10px;right:0;height:2px;background:var(--danger);z-index:20;pointer-events:none;border-radius:1px}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger)}
.now-line::after{content:"сейчас";position:absolute;right:4px;top:-16px;font-size:9.5px;font-weight:700;color:var(--danger);letter-spacing:.06em;text-transform:uppercase}

.block{
  position:absolute;left:0;right:0;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:10px 12px;overflow:hidden;
  display:flex;gap:10px;align-items:flex-start;
  transition:opacity .25s,transform .1s;
  min-height:44px;
}
.block:active{transform:scale(.985)}
.block .b-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tagc,var(--muted));opacity:.8}
.block .b-time{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:1px;min-width:44px}
.block .b-body{flex:1;min-width:0}
.block .b-title{font-size:14.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .b-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tagc,var(--muted));background:color-mix(in srgb,var(--tagc,#888) 14%,transparent);border-radius:5px;padding:1.5px 6px;margin-top:4px}
.block .b-left{font-size:11px;color:var(--accent);font-weight:700;margin-top:3px}
.block .b-tool-badge{font-size:10px;color:var(--warn);font-weight:600;margin-top:2px}
.b-check{
  flex:none;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  color:transparent;transition:.15s;margin-top:1px;
}
.b-check svg{width:17px;height:17px}
.b-check:active{transform:scale(.88)}
.b-check.done{background:var(--accent);border-color:var(--accent);color:#04120b}

/* block states */
.block.compact{min-height:0;padding:5px 10px;align-items:center;gap:8px}
.block.compact .b-time{font-size:10.5px;min-width:0;padding-top:0}
.block.compact .b-title{font-size:12.5px}
.block.compact .b-body{display:flex;align-items:center;gap:7px;min-width:0}
.block.compact .b-tag,.block.compact .b-left,.block.compact .b-done-lab,
.block.compact .b-missed-lab,.block.compact .b-tool-badge{display:none}
.block.compact .b-check{width:26px;height:26px;margin-top:0;border-width:1.6px}
.block.compact .b-check svg{width:13px;height:13px}
.block.compact.current .b-title{font-size:13.5px}
.block.future{opacity:.62}
.block.future .b-title{color:var(--muted)}
.block.current{
  background:linear-gradient(135deg,rgba(61,220,151,.09),var(--card) 55%);
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent-glow),0 0 26px rgba(61,220,151,.16);
  opacity:1;z-index:10;
}
.block.current .b-title{font-size:16.5px;font-weight:800;color:#fff}
.block.current .b-time{color:var(--accent)}
.block.past{opacity:.55}
.block.past.done-b{border-color:rgba(61,220,151,.35)}
.block.past.done-b .b-title{text-decoration:none;color:var(--muted)}
.block.past.miss-b{border-left:3px solid var(--danger)}
.block.past.miss-b .b-bar{background:var(--danger);opacity:.5}
.b-missed-lab{font-size:10px;color:var(--danger);font-weight:700;margin-top:2px;letter-spacing:.03em}
.b-done-lab{font-size:10px;color:var(--accent);font-weight:700;margin-top:2px;letter-spacing:.03em}
.day-summary{margin:0 14px 8px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;gap:12px}
.day-summary .ds-ring{position:relative;width:46px;height:46px;flex:none}
.day-summary .ds-ring svg{transform:rotate(-90deg)}
.day-summary .ds-ring .ds-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
.ds-text{font-size:12.5px;color:var(--muted)}
.ds-text b{color:var(--text);font-size:13.5px;display:block;margin-bottom:1px}
.empty-day{padding:60px 24px;text-align:center;color:var(--faint);font-size:14px}

/* ===== Cards / sections ===== */
.section{padding:4px 14px 14px}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:18px 4px 9px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:10px}

/* ===== Habits tab ===== */
.water-card{background:linear-gradient(160deg,rgba(90,167,255,.08),var(--card) 50%);border-color:rgba(90,167,255,.25)}
.water-top{display:flex;justify-content:space-between;align-items:baseline}
.water-top .w-lab{font-size:13px;font-weight:700;color:var(--blue)}
.water-top .w-val{font-size:24px;font-weight:800}
.water-top .w-val small{font-size:12px;color:var(--muted);font-weight:600}
.water-bar{height:16px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;margin:12px 0 4px;overflow:hidden;position:relative}
.water-fill{height:100%;width:0%;background:linear-gradient(90deg,#2b6fd6,var(--blue));border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.water-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(0,0,0,.18) 24px 26px)}
.water-goal{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.water-btn{width:100%;margin-top:12px;padding:14px;border-radius:13px;background:var(--blue);color:#04101f;font-size:15.5px;font-weight:800;transition:.15s}
.water-btn:active{transform:scale(.97);filter:brightness(1.1)}
.water-reset{width:100%;margin-top:8px;padding:8px;font-size:12px;color:var(--faint);font-weight:600}
.focus-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.focus-item:last-child{border-bottom:none;padding-bottom:0}
.focus-item:first-child{padding-top:0}
.focus-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.focus-item b{font-size:14px;display:block}
.focus-item p{font-size:12.5px;color:var(--muted);margin-top:2px}
.check-item{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.check-item:last-child{border-bottom:none}
.check-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--border2);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:.15s;margin-top:1px}
.check-box svg{width:13px;height:13px}
.check-item.on .check-box{background:var(--accent);border-color:var(--accent);color:#04120b}
.check-item .c-num{font-size:11px;font-weight:800;color:var(--faint);min-width:16px;padding-top:3px}
.check-item .c-text{font-size:13.5px;flex:1}
.check-item.on .c-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.check-progress{font-size:12px;color:var(--muted);margin-bottom:8px}
.check-progress b{color:var(--accent)}
.nb-card{background:linear-gradient(160deg,rgba(180,138,255,.07),var(--card) 55%);border-color:rgba(180,138,255,.2)}
.nb-card b{color:var(--purple);font-size:14px;display:flex;align-items:center;gap:7px}
.nb-card p{font-size:12.5px;color:var(--muted);margin-top:5px}
.nb-hint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:10px;padding:0 10px}

/* ===== Manage tab ===== */
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:4px;margin:0 14px 14px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:.15s}
.seg button.active{background:var(--accent-dim);color:var(--accent)}
.daytabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:none;padding:9px 0;width:52px;text-align:center;border-radius:11px;background:var(--card);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.daytab.active{background:var(--accent);border-color:var(--accent);color:#04120b}
.daytab.today-mark{position:relative}
.daytab.today-mark::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.daytab.active.today-mark::after{background:#04120b}
.ed-item{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 10px;margin-bottom:8px;transition:.15s}
.ed-item.dragging{opacity:.4}
.ed-item.drag-over{border-color:var(--accent)}
.ed-grip{color:var(--faint);flex:none;cursor:grab;padding:4px 2px;display:flex}
.ed-grip svg{width:16px;height:16px}
.ed-time{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;min-width:88px}
.ed-title{flex:1;font-size:13.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title small{display:block;color:var(--faint);font-size:10.5px;font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;transition:.15s}
.icon-btn:active{background:var(--card2);transform:scale(.92)}
.icon-btn.danger:active{color:var(--danger)}
.icon-btn svg{width:17px;height:17px}
.reorder-col{display:flex;flex-direction:column;gap:1px}
.reorder-col button{padding:1px;color:var(--faint);line-height:1}
.reorder-col button:active{color:var(--accent)}
.add-btn{width:calc(100% - 28px);margin:6px 14px 14px;padding:14px;border-radius:13px;border:1.5px dashed var(--border2);color:var(--accent);font-size:14px;font-weight:700;transition:.15s}
.add-btn:active{background:var(--accent-dim);transform:scale(.98)}
.json-card textarea{width:100%;min-height:200px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#c8e8d8;resize:vertical;outline:none;transition:border-color .2s}
.json-card textarea:focus{border-color:var(--accent)}
.json-card textarea.err{border-color:var(--danger);box-shadow:0 0 0 2px rgba(255,92,92,.15)}
.json-card textarea.ok{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:13px;font-size:15px;font-weight:800;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-accent{background:var(--accent);color:#04120b}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-danger-ghost{background:var(--card);border:1px solid rgba(255,92,92,.3);color:var(--danger)}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .btn{flex:1}
.val-report{margin-top:11px;border-radius:12px;padding:11px 13px;font-size:12.5px;display:none;line-height:1.55}
.val-report.show{display:block}
.val-report.error{background:rgba(255,92,92,.09);border:1px solid rgba(255,92,92,.35);color:#ffb3b3}
.val-report.success{background:var(--accent-dim);border:1px solid var(--accent-glow);color:var(--accent)}
.val-report b{display:block;margin-bottom:4px}
.val-report ul{margin:4px 0 0 16px}
.json-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.json-hint code{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:11px;color:var(--accent)}
.ai-prompt{margin-top:10px;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.5}
.ai-prompt b{color:var(--warn)}

/* ===== v1.1 additions ===== */
.hdr-pills{display:flex;gap:7px;justify-content:center;margin-top:9px}
.pill{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:700;transition:.15s}
.pill:active{transform:scale(.95)}
.pill.active{background:var(--accent-dim);border-color:var(--accent-glow);color:var(--accent)}
.lo-line{text-align:center;font-size:11.5px;font-weight:700;color:var(--warn);margin-top:7px;min-height:14px}
.lo-line.late{color:var(--danger)}
.shift-panel{margin:6px 14px 0;padding:10px 12px;border-radius:12px;background:var(--card);border:1px dashed var(--border2);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.shift-panel .sp-q{flex:1;min-width:120px;font-weight:600}
.sp-btn{padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--border2);color:var(--text);font-size:12px;font-weight:800;transition:.15s}
.sp-btn:active{transform:scale(.94);border-color:var(--accent);color:var(--accent)}
.sp-btn.reset{color:var(--faint);border-style:dashed}
.shift-badge{font-size:9.5px;font-weight:800;color:var(--warn);background:rgba(255,180,84,.12);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
/* plan B */
.pb-head{margin:4px 14px 10px;padding:13px 14px;border-radius:14px;background:linear-gradient(150deg,rgba(61,220,151,.1),var(--card) 60%);border:1px solid var(--accent-glow)}
.pb-head b{font-size:15px;color:var(--accent)}
.pb-head p{font-size:12px;color:var(--muted);margin-top:3px}
.pb-card{position:static;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:0 14px 8px;transform:none}
.pb-card .b-bar{position:static;width:3px;align-self:stretch;border-radius:2px;background:var(--tagc,var(--muted));flex:none}
.pb-card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow)}
/* breathing 6/12 */
.breath-wrap{position:relative;width:150px;height:150px;margin:14px auto;display:flex;align-items:center;justify-content:center}
.breath-circle{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(90,167,255,.5),rgba(90,167,255,.15));border:2px solid var(--blue);transform:scale(.8);will-change:transform}
.breath-phase{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.breath-cycles{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:11px;color:var(--faint);font-weight:700}
/* switch */
.switch-row{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.switch{width:46px;height:27px;border-radius:999px;background:var(--card2);border:1px solid var(--border2);position:relative;transition:.2s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--faint);transition:.2s}
.switch.on{background:var(--accent-dim);border-color:var(--accent)}
.switch.on::after{left:22px;background:var(--accent)}
/* dim (evening warm) theme */
body.dim{
  --bg:#070502; --bg2:#0d0a05; --card:#161109; --card2:#1d1710;
  --border:#2b2317; --border2:#3b3122; --text:#e8dcc4; --muted:#a09378; --faint:#6d6350;
  --accent:#e5b567; --accent-dim:rgba(229,181,103,.13); --accent-glow:rgba(229,181,103,.25);
  --warn:#e5b567; --danger:#e08a7a; --blue:#cfa462; --purple:#c9a98a; --indigo:#c2ab84;
  --tag-routine:#a09378; --tag-sport:#cfc08a; --tag-study:#cfa462; --tag-food:#e5b567; --tag-care:#c9a98a; --tag-sleep:#b3a1c9;
}
body.dim .water-fill{background:linear-gradient(90deg,#8a6a2f,#cfa462)}
body.dim .done-btn{color:#1d1405}
body.dim .block.current{background:linear-gradient(135deg,rgba(229,181,103,.09),var(--card) 55%)}

/* ===== Bottom sheet ===== */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .28s;z-index:80}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;height:88vh;max-height:88vh;
  background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--border2);
  transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  z-index:90;display:flex;flex-direction:column;will-change:transform;
}
.sheet.open{transform:translateY(0)}
.sheet.dragging{transition:none}
.sheet-handle{width:40px;height:4.5px;border-radius:3px;background:var(--border2);margin:9px auto 0;flex:none}
.sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px 20px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-time{font-size:14px;font-weight:800;color:var(--accent)}
.sh-title{font-size:23px;font-weight:850;letter-spacing:-.02em;line-height:1.2;margin-top:3px}
.sh-tags{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.chip{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.chip-status{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:none;letter-spacing:0}
.chip-done{background:var(--accent-dim);color:var(--accent)}
.chip-miss{background:rgba(255,92,92,.12);color:var(--danger)}
.chip-wait{background:rgba(138,138,146,.12);color:var(--muted)}
.sh-close{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.sh-close:active{transform:scale(.9)}
.callout{margin-top:15px;background:rgba(255,180,84,.09);border:1px solid rgba(255,180,84,.4);border-left:4px solid var(--warn);border-radius:12px;padding:12px 13px;font-size:13.5px;font-weight:650;color:#ffd9a0;line-height:1.5}
.callout.danger{background:rgba(255,92,92,.08);border-color:rgba(255,92,92,.4);border-left-color:var(--danger);color:#ffc4c4}
.sh-details{margin-top:16px}
.sh-details .d-line{font-size:14px;line-height:1.6;padding:4px 0;color:#d6d6da}
.sh-details .d-line.bullet{padding-left:16px;position:relative}
.sh-details .d-line.bullet::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7}
.sh-details .d-line.ban{color:#ff9d9d;background:rgba(255,92,92,.06);border-radius:8px;padding-left:10px;padding-right:8px;margin:3px 0}
.sh-details .d-line.head{font-weight:800;color:#fff;font-size:14.5px;margin-top:10px}
.sh-details .d-line.sub{font-weight:700;color:var(--accent);margin-top:8px}
.sh-details .d-line.empty{height:6px}
.sheet-foot{flex:none;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg2)}
.done-btn{width:100%;padding:16px;border-radius:15px;font-size:16px;font-weight:850;background:var(--accent);color:#04120b;transition:.15s;display:flex;align-items:center;justify-content:center;gap:9px}
.done-btn:active{transform:scale(.98)}
.done-btn.undo{background:var(--card);border:1px solid var(--border2);color:var(--muted)}
.done-btn svg{width:20px;height:20px}

/* ===== Timers in sheet ===== */
.timer-box{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;text-align:center}
.timer-box .t-lab{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pomo-ring{position:relative;width:150px;height:150px;margin:12px auto}
.pomo-ring svg{transform:rotate(-90deg)}
.pomo-ring .ring-bg{stroke:var(--border)}
.pomo-ring .ring-fg{stroke:var(--accent);transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 6px var(--accent-glow))}
.pomo-ring.break .ring-fg{stroke:var(--blue);filter:drop-shadow(0 0 6px rgba(90,167,255,.35))}
.pomo-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-time{font-size:34px;font-weight:850;letter-spacing:.01em;line-height:1}
.pomo-phase{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.pomo-cycles{font-size:11px;color:var(--faint);margin-top:3px}
.timer-btns{display:flex;gap:9px;justify-content:center;margin-top:12px}
.t-btn{padding:11px 22px;border-radius:12px;font-size:14px;font-weight:800;background:var(--accent);color:#04120b;transition:.15s}
.t-btn:active{transform:scale(.95)}
.t-btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.carb-time{font-size:40px;font-weight:850;color:var(--warn);margin:8px 0 2px;letter-spacing:.01em}
.carb-sub{font-size:12px;color:var(--muted)}
.carb-done-msg{font-size:15px;font-weight:800;color:var(--accent);margin:10px 0}
.timer-global-note{font-size:11px;color:var(--faint);margin-top:9px}

/* running timer strip (in header of timeline) */
.timer-strip{display:none;margin:8px 14px 0;padding:10px 13px;border-radius:12px;background:rgba(255,180,84,.1);border:1px solid rgba(255,180,84,.35);align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--warn);cursor:pointer}
.timer-strip.show{display:flex}
.timer-strip .ts-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulseDot 1.2s infinite;flex:none}
.timer-strip .ts-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-strip .ts-time{font-variant-numeric:tabular-nums}

/* ===== Editor modal ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{
  position:fixed;left:0;right:0;bottom:0;top:6vh;z-index:101;
  background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--border2);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
.modal.open{transform:translateY(0)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;flex:none}
.modal-head h3{font-size:17px;font-weight:800}
.modal-scroll{flex:1;overflow-y:auto;padding:4px 18px 20px;-webkit-overflow-scrolling:touch}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.field input[type=text],.field input[type=time],.field textarea,.field select{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px;font-size:14.5px;outline:none;transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:130px;resize:vertical;line-height:1.55;font-size:13.5px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.tag-picks{display:flex;gap:6px;flex-wrap:wrap}
.tag-pick{padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--border);color:var(--muted);transition:.15s}
.tag-pick.active{border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.tool-picks{display:flex;gap:8px}
.tool-pick{flex:1;padding:11px;border-radius:11px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--border);color:var(--muted);text-align:center;transition:.15s}
.tool-pick.active{border-color:var(--warn);color:var(--warn);background:rgba(255,180,84,.1)}
.modal-foot{flex:none;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--border);display:flex;gap:9px}

/* ===== Confirm dialog ===== */
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:120;display:none;align-items:center;justify-content:center;padding:30px}
.confirm-backdrop.open{display:flex}
.confirm-box{background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:22px;width:100%;max-width:330px;animation:fadeIn .18s}
.confirm-box p{font-size:14.5px;line-height:1.5;margin-bottom:18px}
.confirm-box .btn-row{margin-top:0}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);transform:translate(-50%,20px);
  background:var(--card2);border:1px solid var(--border2);color:var(--text);
  padding:12px 20px;border-radius:13px;font-size:13.5px;font-weight:700;z-index:200;
  opacity:0;pointer-events:none;transition:.28s cubic-bezier(.22,1,.36,1);
  max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:var(--accent);color:var(--accent);background:rgba(61,220,151,.1)}
#toast.err{border-color:var(--danger);color:#ff9d9d;background:rgba(255,92,92,.1)}

/* ===== Timer alert overlay ===== */
.alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center}
.alert-overlay.open{display:flex;animation:fadeIn .2s}
.alert-overlay .al-emoji{font-size:56px}
.alert-overlay .al-title{font-size:24px;font-weight:850;line-height:1.25}
.alert-overlay .al-sub{font-size:14.5px;color:var(--muted);max-width:320px}
.alert-overlay .btn{max-width:280px;margin-top:10px}

/* notif permission banner */
.notif-banner{margin:8px 14px 0;padding:11px 13px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:none;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.notif-banner.show{display:flex}
.notif-banner button{flex:none;padding:7px 13px;border-radius:9px;background:var(--accent);color:#04120b;font-size:12px;font-weight:800}
.notif-banner .nb-x{background:none;color:var(--faint);padding:4px}

@media (min-width:560px){
  #screen{max-width:520px;margin:0 auto;width:100%}
  .sheet,.modal{max-width:520px;left:50%;right:auto;transform:translate(-50%,102%);width:100%}
  .sheet.open,.modal.open{transform:translate(-50%,0)}
  .sheet.dragging.open{transform:translate(-50%,var(--drag-y,0))}
  #nav{max-width:520px;left:50%;transform:translateX(-50%)}
}

</style>
</head>
<body>
<div id="app">
  <div id="screen">

    <!-- ======== TAB 1: TIMELINE ======== -->
    <div class="tabview" id="tab-timeline">
      <div class="hdr">
        <div class="hdr-row">
          <div>
            <div class="hdr-title">Protocol OS</div>
            <div class="hdr-sub" id="notif-today">что делать прямо сейчас — здесь</div>
          </div>
          <div style="font-size:11px;color:var(--faint);text-align:right;font-weight:600">local-first<br>без интернета ✓</div>
        </div>
        <div class="daynav">
          <button class="arrow-btn" id="prev-day" aria-label="Вчера">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="daynav-center">
            <div class="daynav-date" id="dn-date">—</div>
            <div class="daynav-accent" id="dn-accent"></div>
          </div>
          <button class="arrow-btn" id="next-day" aria-label="Завтра">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <button class="today-pill" id="today-pill">↩ Вернуться к Сегодня</button>
        <div class="hdr-pills">
          <button class="pill" id="planb-toggle" title="Сжатый день: чек-минимум + опорные блоки">🅱️ План Б</button>
          <button class="pill" id="dim-toggle" title="Тёплый вечерний режим (после 20:00 включается сам)">🌙 авто</button>

        <div class="lo-line" id="lo-line"></div>

      <div id="shift-panel"></div>

      <div class="notif-banner" id="notif-banner">

      </div>

      <div class="day-summary" id="day-summary" style="display:none"></div>
      <div class="timeline-wrap" id="timeline-wrap"></div>
    </div>

    <!-- ======== TAB 2: HABITS ======== -->
    <div class="tabview" id="tab-habits"></div>

    <!-- ======== TAB 3: MANAGE ======== -->
    <div class="tabview" id="tab-manage"></div>

  </div>

  <!-- ======== BOTTOM NAV ======== -->
  <nav id="nav">
    <button class="nav-btn" data-tab="timeline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      <span>Таймлайн</span>
      <i class="nav-badge" id="badge-timeline"></i>
    </button>
    <button class="nav-btn" data-tab="habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"/><polyline points="9 12 11 14 15 10"/></svg>
      <span>Привычки 24/7</span>
    </button>
    <button class="nav-btn" data-tab="manage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.2" fill="var(--bg2)"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.2" fill="var(--bg2)"/></svg>
      <span>Управление</span>
    </button>
  </nav>
</div>

<!-- ======== BOTTOM SHEET ======== -->
<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div id="sheet-handle-zone" style="cursor:grab;touch-action:none;padding-bottom:2px;flex:none">
    <div class="sheet-handle"></div>
  </div>
  <div class="sheet-scroll" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</div>

<!-- ======== EDITOR MODAL ======== -->
<div class="modal-backdrop" id="editor-backdrop"></div>
<div class="modal" id="editor" role="dialog" aria-modal="true">
  <div id="ed-handle-zone" style="flex:none"><div class="sheet-handle"></div></div>
  <div class="modal-head">
    <h3 id="ed-mode-title">Редактировать блок</h3>
    <button class="sh-close" id="ed-cancel" aria-label="Закрыть">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-scroll">
    <div class="field-row">
      <div class="field"><label>Начало</label><input type="time" id="f-start" value="12:00"></div>
      <div class="field"><label>Окончание</label><input type="time" id="f-end" value="12:30"></div>
    </div>
    <div class="field"><label>Название блока</label><input type="text" id="f-title" placeholder="Например: Спринты ⚡" autocomplete="off"></div>
    <div class="field"><label>Категория / тег</label>
      <div class="tag-picks">
        <button class="tag-pick active" data-tag="routine" style="--tc:var(--tag-routine)">Режим</button>
        <button class="tag-pick" data-tag="sport" style="--tc:var(--tag-sport)">Спорт</button>
        <button class="tag-pick" data-tag="study" style="--tc:var(--tag-study)">Учёба</button>
        <button class="tag-pick" data-tag="food" style="--tc:var(--tag-food)">Питание</button>
        <button class="tag-pick" data-tag="care" style="--tc:var(--tag-care)">Уход</button>
        <button class="tag-pick" data-tag="sleep" style="--tc:var(--tag-sleep)">Сон</button>
      </div>
    </div>
    <div class="field"><label>Важное правило / предупреждение (callout)</label><input type="text" id="f-callout" placeholder="⛔ Бетон запрещён — только тартан/трава" autocomplete="off"></div>
    <div class="field"><label>Встроенные утилиты</label>
      <div class="tool-picks">
        <button class="tool-pick" id="tp-pomodoro">🍅 Помодоро 25/5</button>
        <button class="tool-pick" id="tp-carb">🍚 Таймер углеводов 35′</button>
        <button class="tool-pick" id="tp-breath">🫁 Дыхание 6/12</button>
      </div>
    </div>
    <div class="field"><label>Описание / протокол (переносы строк, • списки)</label><textarea id="f-details" placeholder="• Разминка 5–7 мин&#10;• 6×20 сек на 100–110%&#10;⛔ Отдых — ходьбой, не садиться"></textarea></div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" id="ed-cancel2" style="flex:none;width:110px">Отмена</button>
    <button class="btn btn-accent" id="ed-save">💾 Сохранить блок</button>
  </div>
</div>

<!-- ======== CONFIRM ======== -->
<div class="confirm-backdrop" id="confirm">
  <div class="confirm-box">
    <p id="confirm-text"></p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="confirm-cancel">Отмена</button>
      <button class="btn btn-accent" id="confirm-ok">Подтвердить</button>
    </div>
  </div>
</div>

<!-- ======== TIMER ALERT ======== -->
<div class="alert-overlay" id="alert">
  <div class="al-emoji" id="alert-emoji">⏰</div>
  <div class="al-title" id="alert-title"></div>
  <div class="al-sub" id="alert-sub"></div>
  <button class="btn btn-accent" id="alert-ok">Принято</button>
</div>

<div id="toast"></div>

<script>
/* ============ PROTOCOL OS — Default Data (Мега-гайд v2.6) ============ */
function _b(start, end, title, tag, callout, tools, details) {
  return { start: start, end: end, title: title, tag: tag, callout: callout || null, tools: tools || [], details: details || "" };
}

const _morning = (sprint) => _b("06:00","06:30","Универсальное утро","routine",
  sprint ? "⚡ Спринт-день: завтрак низкоуглеводный (яйца/творог + овощи + жиры)." : "📵 Телефон не трогаем. Яркий свет — в первые 15 минут.",
  [],
  "• Подъём, стакан воды 500 мл, яркий свет в первые 15 мин (окно/балкон 2–3 мин) — якорь циркадиана\n" +
  "• Зубы: скребок для языка (5–7 движений от корня) → флосс → монопучковая по линии десны → электрощётка 2 мин (паста с фтором, без SLS) → сплюнуть, НЕ полоскать\n" +
  "• Умывание: умывалка (CeraVe/Cetaphil) → азелаинка → увлажняющий крем → SPF обязательно → брови: гель/вазелин + щёточка\n" +
  "• Губы: гиалуронка на влажные → SPF-бальзам. Опция: лёд в ткани 15 сек от отёков (⛔ при куперозе и активном акне)\n" +
  "• Мини-зарядка 6 мин: вис на турнике 45 сек ×2 + pogo jumps 25 сек ×2 + Eye Workout (вверх-вниз 10, влево-вправо 10, круги 10+10, фокус 10, пальминг 30 сек) + Eye Pushing 10–15 (с кремом!)\n" +
  (sprint
    ? "• Завтрак НИЗКОУГЛЕВОДНЫЙ: яйца/творог + овощи + жиры (закисление мышц → лактатный пик → HGH)"
    : "• Завтрак: белок + жиры + углеводы — яйца/творог + овсянка или тост, ягоды") +
  "\n• Одеться, рюкзак: две лямки, <10–15% веса тела, тяжёлое к спине\n" +
  "• Если не успеваешь: неприкосновенны — свет, зубы, SPF, завтрак");

const _road = () => _b("06:30","07:00","Дорога в школу","routine",null,[],
  "• Пешком = свет + шаги + носовое дыхание\n• Cue: «нить за макушку», плечи назад-вниз, стопа-треножник\n• Темп ~2 шага/сек\n• Глаза не тереть, взгляд мягкий, ладони на виду");

const _lessons1 = (sprintWed) => _b("07:00","13:00","Уроки — первая половина","study",null,[],
  "• Мьюинг 24/7: язык к нёбу (весь массив + корень), губы сомкнуты, зубы разомкнуты на 1–2 мм, дыхание строго носом\n" +
  "• Posture check каждый час (на перемене): «нить за макушку», плечи назад-вниз + chin tucks 10 повт. — 2–3 раза за день\n" +
  "• 20-20-20 на уроках с экраном: каждые 20 мин — 20 сек смотреть на ~6 м\n" +
  "• Телефон экраном вниз, в компании — в карман\n" +
  "• Вода: доводить до 2.5–3 л за день (30–35 мл/кг)\n" +
  "• ~10:30 перекус: орехи 30 г (замоченные) / фрукт / йогурт" +
  (sprintWed ? "\n• ⛔ Спринт-день: после 13:30 никаких перекусов до ужина" : ""));

const _lunch = (sprint) => _b("13:00","13:30","Обед","food",
  sprint ? "⚡ Финиш еды ≤13:30, обед низкоуглеводный. После 13:30 — ничего до ужина (вода — да). 3 ч до спринта!" : null,
  [],
  "• Food sequencing: клетчатка/овощи → белок (мясо/рыба) → углеводы (рис/греча/паста твёрдых сортов)\n" +
  "• После еды — 10–15 мин ходьбы (срезает инсулиновый пик на 30–40%)");

const _lessons2 = () => _b("13:30","15:00","Уроки — вторая половина","study",null,[],
  "• Мьюинг, posture check, 20-20-20 — как утром\n• Социальный тестостерон: 1 микро-победа за день (спросить/поздороваться с незнакомым, комплимент, вопрос на уроке)\n• Взгляд прохожему — не отводить первым, отводить ВБОК");

const _afterSchool = (sprint) => sprint
  ? _b("15:00","15:20","Дом, переодеться","routine","⛔ Никакого перекуса — спринт через час натощак. Вода — можно.",[],
      "• Переодеться в спортивное\n• Собрать: кроссовки с амортизацией + стельки\n• Проверить поверхность: тартан/трава/горка — НЕ бетон")
  : _b("15:00","15:20","Дом, перекус","food",null,[],
      "• Белок (творог/яйца/протеин) + банан — в дни качалки обязательно, за 45 мин до зала\n• Переодеться, собрать сумку");

const _hw1 = (sprint) => _b("15:20", sprint ? "16:15" : "16:00","Домашка — блок 1","study",
  "📵 Телефон в авиарежим. Работают только помодоро-циклы.",
  ["pomodoro"],
  "• Помодоро: 25 мин работа → 5 мин перерыв (встать/ходить/вода)\n• To-do составлен с вечера — не тратить решения на «что делать»\n• Начинать с самой сложной задачи");

const _hw2 = () => _b("18:45","19:45","Домашка — блок 2","study",
  "📵 Помодоро ×2. Телефон в авиарежим.",
  ["pomodoro"],
  "• Помодоро: 25 мин работа → 5 мин перерыв\n• Добить хвосты блока 1\n• Дописать to-do на завтра (пригодится в 20:45)");

const _shower = (day, start, end) => _b(start || "17:30", end || "18:00","Душ + волосы","care",
  "⛔ Вода только тёплая — холодный душ после тренировки поднимает кортизол.",[],
  "• Сразу после тренировки умыться/помыться, тёплая вода\n" +
  "• Сушка: микрофибра промакиванием, термозащита, фен сверху вниз\n" +
  "• Мокрые волосы не расчёсывать (потом — с кончиков вверх)\n" +
  "• ВОЛОСЫ (" + day + "):\n" + ({
    "Пн":"• Кислотный пилинг скальпа (Glycolic 7%, 10 мин, до мытья)\n• Низорал 2% — держать 3–5 мин\n• Кондиционер на длину",
    "Вт":"• Шампунь без SLS\n• Розмариновый тоник ДО фена\n• Термозащита",
    "Ср":"• Ко-вошинг / ополаскивание\n• Кондиционер\n• Если по графику — кетоконазол (Низорал 2%, держать 3–5 мин)",
    "Чт":"• Пилинг скальпа №2 (Glycolic 7%, 10 мин)\n• Кондиционер",
    "Пт":"• Ко-вошинг + кондиционер\n• Детумесцентный массаж скальпа 10 мин — в комбо-сессии",
    "Сб":"• Шампунь без SLS + тоник\n• Филлер CP-1/Lador (1 р/нед вместо маски)",
    "Вс":"• Ополаскивание / ко-вошинг\n• Ежедневно: массаж скальпа 5 мин подушечками, вода не горячее температуры тела"
  })[day]);

const _dinner = (sprint) => _b("18:00","18:30","Ужин","food",
  sprint ? "⚡ Углеводы — только через 30–40 мин после финиша спринтов. Сначала белок + овощи." : null,
  [],
  "• Белок + овощи + углеводы; жиры = один большой палец на приём\n• Food sequencing: клетчатка → белок → углеводы\n• После ужина — ходьба 10–15 мин\n• Триптофан-еда на ужин: рис/индейка/тыквенные семечки");

const _facebuild = () => _b("19:45","20:15","Фейсбилдинг + шея","care",
  "⛔ Шея — только изометрия. Никаких рывков, блинов и борцовских мостов.",[],
  "• Разминка: артикуляционная гимнастика («рыбка-улыбка» ×10, «часы», «змейка»)\n" +
  "• «О-Е» артикуляция 3×15 (губы завёрнуты внутрь, без звука)\n" +
  "• «Оскал» статика скул 3×30 сек (губы за зубы, пальцы на «яблочках»)\n" +
  "• NG-вакуум 4×45 сек: улыбнуться → сглотнуть → вакуум; зубы НЕ стиснуты (зазор 1 мм), дыхание носом\n" +
  "• Шея: изометрия — давление лбом/затылком/висками в ладонь 10–15 сек + очень лёгкие сгибания лёжа\n" +
  "• «Лучше 3 месяца слабой изометрии, чем одна тренировка с блином»\n" +
  "• Жевание: Falim/жёсткая жвачка 10–15 мин на ОБЕ стороны (⛔ не >30–60 мин/день — ТМДШ) или 2 моркови\n" +
  "• Frontalis-релиз: 25 медленных повторов руками + контроль «не удивляться бровями»\n" +
  "• Стоп-сигналы: щёлкает ВНЧС → снизить нагрузку; боль у уха → стоп, к гнатологу");

const _feet = () => _b("19:45","20:15","Стопы — полный комплекс","care",
  "⛔ Боль в пятке/плюсне/надкостнице → стоп ударные, к ортопеду (плоскостопие!).",[],
  "• Мячик: катание 2×60 сек/нога\n• Захват полотенца пальцами 2×60 сек\n• Short foot 3×12 (удержание 5 сек)\n• Ходьба на носках 2×45 сек\n• Ходьба на пятках 2×45 сек\n• Подъёмы на носки 3×15, темп 3-2-3");

const _eveningCare = () => _b("20:15","20:45","Вечерний уход + зубы + осанка","care",null,["breath"],
  "1. Мицеллярка / гидрофильное масло → умывалка\n" +
  "2. Гуаша / лимфодренаж по маслу 5–7 мин: сначала шея и ключицы, потом лицо по массажным линиям (инструмент мыть после каждого использования)\n" +
  "3. Актив по ТВОЕЙ схеме (адапален — лестница; день дермоштампа = без миноксидила и без кислот)\n" +
  "4. Крем → бальзам на губы (вазелин/ланолин)\n" +
  "5. Зубы: флосс → ирригатор → монопучковая → электрощётка 2 мин → сплюнуть, не полоскать → K12/M18 рассасывать на ночь → 30 мин не есть/не пить\n" +
  "6. Ногти коротко и чисто; тело/подмышки по рутине\n" +
  "7. Осаночный комплекс 15–25 мин: chin tucks у стены 3×15 → wall angels 3×12 → дверной проём 2×60/сторона → ролл под лопатки 2×15 (задержка 3 сек) → Y-W-T 3×10 → выпад на подвздошно-поясничную 2×60/нога → дыхание 6/12 ×15–20 циклов");

const _planning = () => _b("20:45","21:00","Планирование + журналы","routine",
  "📓 Всё — в бумажный блокнот. Никаких экранных полей: защита от залипания перед сном.",[],
  "• To-Do на завтра: 1 крупная + 3 средние + 5 мелких задач, дедлайн к каждой\n" +

  routine:{ru:"Режим",c:"var(--tag-routine)"}, sport:{ru:"Спорт",c:"var(--tag-sport)"},
  study:{ru:"Учёба",c:"var(--tag-study)"}, food:{ru:"Питание",c:"var(--tag-food)"},
  care:{ru:"Уход",c:"var(--tag-care)"}, sleep:{ru:"Сон",c:"var(--tag-sleep)"}
};
const PX_PER_MIN = 1.5;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const toMin = hm => { const [h,m] = hm.split(":").map(Number); return h*60+m; };
const fmtMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayKeyOf = d => DAYS[(d.getDay()+6)%7];
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

function S_get(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function S_set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function doneMap(dk){ const all = S_get(K.DONE, {}); return all[dk] || {}; }
function setDone(dk, bk, val){
  const all = S_get(K.DONE, {});
  all[dk] = all[dk] || {};
  if(val) all[dk][bk] = 1; else delete all[dk][bk];
  S_set(K.DONE, all);
}
const blockKey = b => `${b.start}|${b.title}`;

function blockStatus(dk, b){
  const d = new Date(dk + "T00:00:00");
  const t = new Date();
  if(d < today0()) return "past";
  if(d > today0()) return "future";
  const nm = t.getHours()*60 + t.getMinutes() + t.getSeconds()/60;
  if(nm < toMin(b.start)) return "future";
  if(nm >= toMin(b.end)) return "past";
  return "current";
}

/* ---------- Sound / vibration / notifications ---------- */
let AC = null;
function beep(n){
  n = n || 3;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    let t = AC.currentTime;
    for(let i=0;i<n;i++){
      const o = AC.createOscillator(), g = AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type = "sine"; o.frequency.value = i===n-1 ? 1174 : 880;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.35, t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t+.3);
      o.start(t); o.stop(t+.32);
      t += .38;
    }
  }catch(e){}
  if(navigator.vibrate) try{ navigator.vibrate([200,100,200,100,400]); }catch(e){}
}
function notify(title, body){
  try{
    if("Notification" in window && Notification.permission === "granted"){
      const n = new Notification(title, { body: body || "", icon: ICON_URL, badge: ICON_URL, tag: title });
      if(n.onclick !== undefined) n.onclick = ()=>{ window.focus(); n.close(); };
      return true;
    }
  }catch(e){}
  return false;
}
function requestNotif(){
  if(!("Notification" in window)){ toast("Уведомления не поддерживаются этим браузером","err"); return; }
  Notification.requestPermission().then(p=>{
    updateNotifBanner();
    if(p === "granted"){ toast("Уведомления включены ✓","ok"); notify("Protocol OS","Уведомления о начале блоков активны."); }
    else toast("Разрешение не выдано — включи в настройках браузера","err");
  });
}
function updateNotifBanner(){
  const b = $("#notif-banner");
  if(!b) return;
  const show = "Notification" in window && Notification.permission === "default" && !S_get(K.NB, 0);
  b.classList.toggle("show", show);
}
function showAlert(emoji, title, sub){

  $("#alert-title").textContent = title;
  $("#alert-sub").textContent = sub || "";
  $("#alert").classList.add("open");

}

/* ---------- Timers (pomodoro / carb) ---------- */
let timers = S_get(K.TIMERS, { pomo:null, carb:null });
const POMO_WORK = 25*60*1000, POMO_BREAK = 5*60*1000, CARB_MS = 35*60*1000;

function saveTimers(){ S_set(K.TIMERS, timers); }

function pomoStart(bk, dk){
  timers.pomo = { running:true, mode:"work", endsAt:Date.now()+POMO_WORK, remain:POMO_WORK, cycles:0, bk, dk, alarmed:false };
  saveTimers(); renderTimersEverywhere();
  toast("Помодоро: 25 мин работы. Телефон — в авиарежим 📵","ok");
}
function pomoPause(){
  const p = timers.pomo; if(!p || !p.running) return;
  p.remain = Math.max(0, p.endsAt - Date.now()); p.running = false; saveTimers(); renderTimersEverywhere();
}
function pomoResume(){
  const p = timers.pomo; if(!p || p.running) return;
  p.endsAt = Date.now() + p.remain; p.running = true; p.alarmed = false; saveTimers(); renderTimersEverywhere();
}
function pomoReset(){ timers.pomo = null; saveTimers(); renderTimersEverywhere(); }
function carbStart(bk, dk){
  timers.carb = { endsAt:Date.now()+CARB_MS, bk, dk, alarmed:false };
  saveTimers(); renderTimersEverywhere();
  toast("Таймер углеводов запущен: 35 мин ⏱","ok");
}
function carbStop(){ timers.carb = null; saveTimers(); renderTimersEverywhere(); }

function timerTick(){
  const now = Date.now();
  let dirty = false;
  const p = timers.pomo;
  if(p && p.running && !p.alarmed && now >= p.endsAt){
    p.alarmed = true; dirty = true;
    if(p.mode === "work"){
      p.cycles = (p.cycles||0) + 1;
      p.mode = "break"; p.endsAt = now + POMO_BREAK; p.remain = POMO_BREAK; p.alarmed = false;
      saveTimers();
      notify("⏸ Помодоро: перерыв 5 мин", `Цикл ${p.cycles} завершён. Встань, пройдись, выпей воды.`);
      if(!document.hidden) showAlert("⏸","Перерыв 5 минут","Встань, пройдись, выпей воды. Потом — следующий цикл.");
      else beep(3);
    } else {
      p.mode = "work"; p.endsAt = now + POMO_WORK; p.remain = POMO_WORK; p.alarmed = false;
      saveTimers();
      notify("▶️ Помодоро: работа 25 мин", "Следующий цикл начался. Телефон в авиарежим.");
      if(!document.hidden) showAlert("▶️","Работа: 25 минут","Следующий помодоро-цикл начался. Фокус.");
      else beep(3);
    }
  }
  const c = timers.carb;
  if(c && !c.alarmed && now >= c.endsAt){
    c.alarmed = true; dirty = true;
    notify("🍚 Окно открыто: можно углеводы", "30–40 мин после спринта прошло — восстанавливаем гликоген.");
    if(!document.hidden) showAlert("🍚","Окно открыто: можно углеводы","35 минут после спринта прошло. Белок + овощи + углеводы — восстанавливаем гликоген.");
    else beep(4);
    saveTimers();
  }
  renderTimersEverywhere(dirty);
}

function fmtRemain(ms){
  ms = Math.max(0, ms);
  const s = Math.ceil(ms/1000);
  return `${pad(Math.floor(s/60))}:${pad(s%60)}`;
}

/* ---------- Effective schedule (with day shifts) ---------- */
function shiftsFor(dk){ return S_get(K.SHIFT, {})[dk] || []; }
function effSchedule(dayKey, dk){
  const day = DATA.week && DATA.week[dayKey];
  if(!day || !Array.isArray(day.schedule)) return [];
  const recs = shiftsFor(dk);
  if(!recs.length) return day.schedule;
  return day.schedule.map(b=>{
    let off = 0;
    recs.forEach(r=>{ if(toMin(b.start) >= r.anchor) off += r.offset; });
    if(!off) return b;
    const nb = Object.assign({}, b, {
      start: fmtMin(Math.min(toMin(b.start)+off, 23*60+55)),
      end: fmtMin(Math.min(toMin(b.end)+off, 23*60+59)),
      _shift: off
    });
    return nb;
  });
}
function applyShift(mins){
  const dk = dateKey(new Date());
  const all = S_get(K.SHIFT, {});
  all[dk] = (all[dk] || []).concat([{ anchor: nowMin(), offset: mins }]);
  S_set(K.SHIFT, all);
  toast(`Оставшиеся блоки сдвинуты на +${mins} мин. Держись!`, "ok");
  renderTimeline(false);
}
function resetShift(){
  const dk = dateKey(new Date());
  const all = S_get(K.SHIFT, {});
  delete all[dk];
  S_set(K.SHIFT, all);
  toast("Сдвиг сброшен — базовая сетка дня");
  renderTimeline(false);
}

/* ---------- Dim (evening warm) mode + lights-out countdown ---------- */
function applyDim(){
  const mode = S_get(K.DIM, "auto");
  const h = new Date().getHours();
  const on = mode === "on" || (mode === "auto" && (h >= 20 || h < 6));
  document.body.classList.toggle("dim", on);
  const btn = $("#dim-toggle");
  if(btn) btn.textContent = mode === "on" ? "🌙 вкл" : mode === "off" ? "☀️ выкл" : (on ? "🌙 авто·вкл" : "🌙 авто");
  btn && btn.classList.toggle("active", on);
}
function updateLightsOut(blocks, today){
  const el = $("#lo-line");
  if(!el) return;
  const sleepBlocks = blocks.filter(b=> b.tag === "sleep");
  if(!sleepBlocks.length){ el.textContent = ""; el.className = "lo-line"; return; }
  const endM = Math.max(...sleepBlocks.map(b=>toMin(b.end)));
  if(!today){
    el.textContent = `🌙 отбой в этот день: ${fmtMin(endM)}`;
    el.className = "lo-line";
    return;
  }
  const nm = nowMin();
  const diff = endM - nm;
  if(diff > 0){
    const h = Math.floor(diff/60), m = diff%60;
    el.textContent = `🌙 до отбоя ${h>0 ? h+" ч " : ""}${m} мин (${fmtMin(endM)})`;
    el.className = "lo-line";
  } else {
    el.textContent = "🌙 время отбоя — телефон в другую комнату";
    el.className = "lo-line late";
  }
}

/* ---------- Plan B (compressed day) ---------- */
function planBAnchors(blocks){
  if(!blocks.length) return [];
  const idx = [0];
  let si = -1, sl = 0;
  blocks.forEach((b,i)=>{ if(b.tag === "sport"){ const d = toMin(b.end)-toMin(b.start); if(d > sl){ sl = d; si = i; } } });
  if(si > 0) idx.push(si);
  const ec = blocks.findIndex(b=> b.tag === "care" && toMin(b.start) >= 20*60);
  if(ec > 0) idx.push(ec);
  const sb = blocks.findIndex(b=> b.tag === "sleep" && toMin(b.start) >= 21*60);
  if(sb > 0) idx.push(sb);
  return Array.from(new Set(idx));
}
function checkListHTML(items){

      <div class="c-text">${esc(c)}</div>
    </div>`).join("");
}
function bindCheckList(dk, items, root, onDone){
  root.querySelectorAll(".check-item").forEach(it=>{
    const i = it.dataset.ci;
    const all = S_get(K.CHECK, {});
    it.classList.toggle("on", !!(all[dk] && all[dk][i]));

      a[dk] = a[dk] || {};

      it.classList.toggle("on");
      if(a[dk][i] && navigator.vibrate) try{ navigator.vibrate(25); }catch(e){}

    });
  });
}

/* ---------- Block-start + pre-notifications ---------- */
function checkBlockNotifs(){
  const now = new Date();
  const dk = dateKey(now);
  const dayKey = dayKeyOf(now);
  const blocks = effSchedule(dayKey, dk);
  if(!blocks.length) return;
  const notified = S_get(K.NOTIFIED, {});
  notified[dk] = notified[dk] || {};
  const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let changed = false;
  blocks.forEach(b=>{
    if(b.start === hm && !notified[dk][b.start]){
      notified[dk][b.start] = 1; changed = true;
      const body = b.callout ? b.callout.replace(/^[^\s]+\s/, m=>m) : (b.details||"").split("\n").find(l=>l.trim()) || "Время блока наступило.";
      notify(`${b.start} — ${b.title}`, body);
      if(!document.hidden && document.hasFocus()) beep(2);
      if(navigator.vibrate) try{ navigator.vibrate(300); }catch(e){}
    }
  });
  if(changed) S_set(K.NOTIFIED, notified);
  // pre-reminder: 10 min before block start
  const pre = S_get(K.PRE, {});
  pre[dk] = pre[dk] || {};
  const nmExact = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  let preChanged = false;
  blocks.forEach(b=>{
    const diff = toMin(b.start) - nmExact;
    if(diff > 0 && diff <= 10 && !pre[dk][b.start]){
      pre[dk][b.start] = 1; preChanged = true;
      const mins = Math.max(1, Math.round(diff));
      notify(`Через ${mins} мин — ${b.title}`, b.callout || "Пора готовиться к блоку.");
      if(!document.hidden && document.hasFocus()) toast(`⏳ Через ${mins} мин: ${b.title}`, "");
    }
  });
  if(preChanged) S_set(K.PRE, pre);
}

/* ---------- Smart 24/7 reminders (posture / water) ---------- */
const FOCUS_PINGS = [
  "🧍 Posture check: нить за макушку, плечи назад-вниз + chin tucks 10",
  "👅 Мьюинг: язык к нёбу, дыхание носом",
  "👁 20-20-20: отведи взгляд на ~6 м на 20 сек",
  "📵 Телефон экраном вниз. Ладони на виду"
];
function checkSmartReminders(){
  if(!S_get(K.REMINDON, 1)) return;
  const now = new Date();
  const t = now.getHours()*60 + now.getMinutes();
  const inWindow = (t >= 6*60+30 && t < 7*60) || (t >= 15*60 && t < 21*60);
  if(!inWindow) return;
  const dk = dateKey(now);
  const st = S_get(K.REMIND, {});
  const nowTs = Date.now();
  let changed = false;
  // water ping: no glass for 2h and goal not reached
  const H = DATA.habits_24_7 || {};
  const goal = (H.hydration && H.hydration.goal_ml) || 3000;
  const ml = (S_get(K.WATER, {})[dk]) || 0;
  const wts = (S_get(K.WTS, {})[dk]) || 0;
  if(ml < goal && nowTs - wts > 2*3600*1000 && nowTs - (st.waterPing||0) > 2*3600*1000){
    st.waterPing = nowTs; changed = true;
    notify("💧 Вода", "Давно не отмечал воду. Открой «Привычки 24/7» → +250 мл.");
  }
  // focus ping rotation every 2h
  if(nowTs - (st.focusPing||0) > 2*3600*1000){
    st.focusPing = nowTs;
    st.idx = ((st.idx||0) + 1) % FOCUS_PINGS.length;
    changed = true;
    notify("Фокус 24/7", FOCUS_PINGS[st.idx]);
  }
  if(changed) S_set(K.REMIND, st);
}

/* ---------- Timeline ---------- */
function renderTimeline(scrollToNow){
  const dayKey = dayKeyOf(viewDate);
  const day = DATA.week && DATA.week[dayKey];
  const dk = dateKey(viewDate);
  const today = isToday(viewDate);

  // header
  const now = new Date();
  $("#dn-date").textContent = `${cap(WD_short(viewDate))}, ${viewDate.getDate()} ${MONTHS[viewDate.getMonth()]}`;
  $("#dn-accent").textContent = day ? (day.accent || "") : "";
  $("#today-pill").classList.toggle("show", !today);
  $("#notif-today").style.display = today ? "" : "none";

  const wrap = $("#timeline-wrap");
  renderShiftPanel(today, dk);
  const pbBtn = $("#planb-toggle");
  if(pbBtn) pbBtn.classList.toggle("active", !!S_get(K.PLANB, {})[dk]);
  const blocks = effSchedule(dayKey, dk);
  updateLightsOut(blocks, today);
  if(!blocks.length){
    wrap.innerHTML = `<div class="empty-day">На этот день блоков нет.<br>Добавь их в «Управление → Конструктор».</div>`;
    renderSummary(dk, [], day);
    return;
  }
  if(S_get(K.PLANB, {})[dk]){
    renderPlanB(dk, dayKey, blocks, day);
    return;
  }
  const done = doneMap(dk);
  const starts = blocks.map(b=>toMin(b.start)), ends = blocks.map(b=>toMin(b.end));
  const minM = Math.min(...starts), maxM = Math.max(...ends);
  const totalPx = (maxM - minM) * PX_PER_MIN;
  const nm = nowMin();

  let html = `<div class="timeline" style="height:${totalPx}px">`;
  // hour lines
  for(let m = Math.ceil(minM/60)*60; m <= maxM; m += 60){
    const y = (m - minM) * PX_PER_MIN;
    html += `<div class="hour-line" style="top:${y}px"></div><div class="hour-lab" style="top:${y}px">${fmtMin(m)}</div>`;
  }
  // now line
  if(today && nm >= minM && nm <= maxM){
    html += `<div class="now-line" id="now-line" style="top:${(nm - minM) * PX_PER_MIN}px"></div>`;
  }
  blocks.forEach((b,i)=>{
    const st = blockStatus(dk, b);
    const isDone = !!done[blockKey(b)];
    const top = (toMin(b.start) - minM) * PX_PER_MIN;
    const slotH = (toMin(b.end) - toMin(b.start)) * PX_PER_MIN;
    const compact = slotH < 52;
    const h = compact ? Math.max(slotH - 3, 30) : Math.max(slotH - 5, 44);
    const tag = TAGS[b.tag] || TAGS.routine;
    let cls = "block " + st + (compact ? " compact" : "");
    if(st === "past") cls += isDone ? " done-b" : " miss-b";
    let extra = "";
    if(st === "current"){
      const left = Math.max(0, Math.ceil(toMin(b.end) - (nm + new Date().getSeconds()/60)));
      extra = `<div class="b-left num">▶ сейчас · осталось ${left} мин</div>`;
    } else if(st === "past"){
      extra = isDone ? `<div class="b-done-lab">✓ Выполнено</div>` : `<div class="b-missed-lab">○ Не выполнено — нажми, чтобы отметить</div>`;
    }
    const toolsBadge = (b.tools||[]).filter(t=>t!=="none").length && st !== "past"
      ? `<div class="b-tool-badge">⏱ ${(b.tools||[]).includes("pomodoro")?"помодоро":""}${(b.tools||[]).includes("carb_timer")?"таймер углеводов":""}</div>` : "";
    html += `
    <div class="${cls}" style="top:${top}px;height:${h}px;--tagc:${tag.c}" data-i="${i}" data-dk="${dk}">
      <div class="b-bar"></div>
      <div class="b-time num">${esc(b.start)}–${esc(b.end)}</div>
      <div class="b-body">
        <div class="b-title">${esc(b.title)}${b._shift?`<span class="shift-badge">сдвиг +${b._shift}′</span>`:""}</div>
        <span class="b-tag">${tag.ru}</span>
        ${extra}${toolsBadge}
      </div>
      <button class="b-check ${isDone?"done":""}" data-check="${i}" aria-label="Отметить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>`;
  });
  html += `</div>`;
  wrap.innerHTML = html;

  // summary
  renderSummary(dk, blocks, day);

  // events
  wrap.querySelectorAll(".block").forEach(el=>{
    el.addEventListener("click", e=>{
      if(e.target.closest("[data-check]")) return;
      openSheet(dk, dayKey, +el.dataset.i);
    });
  });
  wrap.querySelectorAll("[data-check]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const i = +btn.dataset.check;
      const b = blocks[i];
      const on = !doneMap(dk)[blockKey(b)];
      setDone(dk, blockKey(b), on);
      if(on && navigator.vibrate) try{ navigator.vibrate(30); }catch(e2){}
      renderTimeline(false); renderSummary(dk, blocks, day);
    });
  });

  if(scrollToNow && today){
    requestAnimationFrame(()=>{
      const nl = $("#now-line");
      const target = nl ? nl.offsetTop - 140 : 0;
      $("#screen").scrollTop = Math.max(0, target);
    });
  } else if(scrollToNow){
    $("#screen").scrollTop = 0;
  }
  updateTimerStrip();
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function WD_short(d){ return WD[d.getDay()]; }

function renderSummary(dk, blocks, day){
  const el = $("#day-summary");
  if(!blocks.length){ el.style.display = "none"; return; }
  const done = doneMap(dk);
  const total = blocks.length;
  let dn = 0;
  blocks.forEach(b=>{ if(done[blockKey(b)]) dn++; });
  const pct = Math.round(dn/total*100);
  const C = 2*Math.PI*20;
  el.style.display = "flex";
  el.innerHTML = `
    <div class="ds-ring">
      <svg width="46" height="46"><circle cx="23" cy="23" r="20" fill="none" stroke="var(--border)" stroke-width="4"/>
      <circle cx="23" cy="23" r="20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <div class="ds-val num">${pct}%</div>
    </div>
    <div class="ds-text"><b>${dn} из ${total} блоков выполнено</b>${day && day.accent ? esc(day.accent) : ""}</div>`;
}

/* ---------- Timer strip (global) ---------- */
function updateTimerStrip(){
  const strip = $("#timer-strip");
  if(!strip) return;
  const p = timers.pomo, c = timers.carb;
  const now = Date.now();
  let parts = [];
  if(p && (p.running || p.remain>0)){
    const ms = p.running ? p.endsAt - now : p.remain;
    parts.push(`🍅 Помодоро ${p.mode==="work"?"работа":"перерыв"}: ${fmtRemain(ms)}`);
  }
  if(c && !c.alarmed){
    parts.push(`🍚 Углеводы через ${fmtRemain(c.endsAt - now)}`);
  } else if(c && c.alarmed){
    parts.push(`🍚 Окно углеводов ОТКРЫТО`);
  }
  if(parts.length){
    strip.classList.add("show");
    strip.querySelector(".ts-text").textContent = parts.join("  ·  ");
  } else strip.classList.remove("show");
}

/* ---------- Bottom sheet ---------- */
function openSheet(dk, dayKey, index){
  const day = DATA.week[dayKey];
  const b = day.schedule[index];
  if(!b) return;
  sheetCtx = { dk, dayKey, index, bk: blockKey(b) };
  $("#sheet").classList.add("open");
  $("#sheet-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
  renderSheet();
}
function closeSheet(force){
  const p = timers.pomo;
  const needConfirm = !force && p && p.running && sheetCtx && sheetCtx.bk === p.bk && sheetCtx.dk === p.dk;
  if(needConfirm){
    askConfirm("Помодоро-таймер работает. Закрыть шторку? Таймер продолжит идти и подаст сигнал.", ()=> closeSheet(true), "Закрыть");
    return;
  }
  $("#sheet").classList.remove("open");
  $("#sheet-backdrop").classList.remove("open");
  document.body.style.overflow = "";
  sheetCtx = null;
  setTimeout(()=>{ if(!$("#sheet").classList.contains("open")) $("#sheet-body").innerHTML=""; }, 350);
  renderTimeline(false);
}
$("#sheet-backdrop").addEventListener("click", ()=> closeSheet(false));

// swipe down to close
(function(){
  const sheet = $("#sheet"), handle = $("#sheet-handle-zone");
  let startY = null, dy = 0, dragging = false;
  handle.addEventListener("touchstart", e=>{ startY = e.touches[0].clientY; dragging = true; sheet.classList.add("dragging"); }, {passive:true});
  handle.addEventListener("touchmove", e=>{
    if(!dragging) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    if(dy > 0){
      const wide = window.innerWidth >= 560;
      sheet.style.transform = wide ? `translate(-50%,${dy}px)` : `translateY(${dy}px)`;
    }
  }, {passive:true});
  handle.addEventListener("touchend", ()=>{
    dragging = false; sheet.classList.remove("dragging"); sheet.style.transform = "";
    if(dy > 90) closeSheet(false);
    dy = 0;
  });
})();

function renderSheet(){
  if(!sheetCtx) return;
  const { dk, dayKey, index } = sheetCtx;
  const blocks = effSchedule(dayKey, dk);
  const b = blocks[index];
  if(!b){ closeSheet(true); return; }
  const tag = TAGS[b.tag] || TAGS.routine;
  const done = !!doneMap(dk)[blockKey(b)];
  const st = blockStatus(dk, b);
  const statusChip = st === "current"
    ? `<span class="chip-status chip-wait">▶ идёт сейчас</span>`
    : st === "past"
      ? (done ? `<span class="chip-status chip-done">✓ выполнено</span>` : `<span class="chip-status chip-miss">○ пропущено</span>`)
      : `<span class="chip-status chip-wait">ожидает</span>`;

  const d = new Date(dk + "T00:00:00");
  const dateLine = `${d.getDate()} ${MONTHS[d.getMonth()]}, ${DAY_RU[dayKey]}`;

  let html = `
    <div class="sheet-head">
      <div>
        <div class="sh-time num">${esc(b.start)}–${esc(b.end)} · <span style="color:var(--muted);font-weight:600">${dateLine}</span></div>
        <div class="sh-title">${esc(b.title)}</div>
        <div class="sh-tags">
          <span class="chip" style="color:${tag.c};background:color-mix(in srgb,${tag.c} 14%,transparent)">${tag.ru}</span>
          ${statusChip}
        </div>
      </div>
      <button class="sh-close" id="sheet-close" aria-label="Закрыть">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;

  if(b.callout){
    const danger = b.callout.includes("⛔");
    html += `<div class="callout ${danger?"danger":""}">${esc(b.callout)}</div>`;
  }

  // tools
  const tools = (b.tools||[]).filter(t=>t && t!=="none");
  if(tools.includes("pomodoro")) html += renderPomoBox(b);
  if(tools.includes("carb_timer")) html += renderCarbBox(b);
  if(tools.includes("breath")) html += renderBreathBox(b);

  if(b.details){
    html += `<div class="sh-details">${renderDetails(b.details)}</div>`;
  }

  $("#sheet-body").innerHTML = html;
  $("#sheet-close").addEventListener("click", ()=> closeSheet(false));

  // foot
  const foot = $("#sheet-foot");
  foot.innerHTML = done
    ? `<button class="done-btn undo" id="done-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>
        Снять отметку</button>`
    : `<button class="done-btn" id="done-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Отметить выполненным</button>`;
  $("#done-toggle").addEventListener("click", ()=>{
    const nowDone = !doneMap(dk)[blockKey(b)];
    setDone(dk, blockKey(b), nowDone);
    if(nowDone && navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
    toast(nowDone ? "✓ Выполнено" : "Отметка снята", nowDone ? "ok" : "");
    renderSheet(); renderTimeline(false);
  });

  bindTimerButtons(b);
  updateSheetTimers();
}

function renderDetails(text){
  return text.split("\n").map(line=>{
    const t = line.trim();
    if(!t) return `<div class="d-line empty"></div>`;
    if(t.startsWith("•") || t.startsWith("-")) return `<div class="d-line bullet">${esc(t.replace(/^[•\-]\s*/,""))}</div>`;
    if(t.includes("⛔")) return `<div class="d-line ban">${esc(t.replace(/^•\s*/,""))}</div>`;
    if(/^\d+\./.test(t)) return `<div class="d-line sub">${esc(t)}</div>`;
    if(/^[A-ZА-ЯЁ\u{1F300}-\u{1FAFF}]/u.test(t) && (t.endsWith(":") || t.length < 34)) return `<div class="d-line head">${esc(t)}</div>`;
    return `<div class="d-line">${esc(t)}</div>`;
  }).join("");
}

/* ----- pomodoro box ----- */

  const p = timers.pomo;
  const mine = p && p.bk === blockKey(b) && sheetCtx && p.dk === sheetCtx.dk;
  const R = 62, C = 2*Math.PI*R;
  return `
  <div class="timer-box" id="pomo-box">
    <div class="t-lab">🍅 Помодоро · 25 / 5</div>
    <div class="pomo-ring ${mine && p.mode==="break" ? "break":""}" id="pomo-ring">
      <svg width="150" height="150">
        <circle class="ring-bg" cx="75" cy="75" r="${R}" fill="none" stroke-width="7"/>
        <circle class="ring-fg" id="pomo-arc" cx="75" cy="75" r="${R}" fill="none" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="pomo-center">
        <div class="pomo-time num" id="pomo-time">25:00</div>
        <div class="pomo-phase" id="pomo-phase">${mine ? (p.mode==="work"?"работа":"перерыв") : "фокус"}</div>

        ? `<button class="t-btn" id="pomo-start">▶ Старт 25 мин</button>`
        : p.running
          ? `<button class="t-btn ghost" id="pomo-pause">⏸ Пауза</button><button class="t-btn ghost" id="pomo-reset">⟲ Сброс</button>`
          : `<button class="t-btn" id="pomo-resume">▶ Продолжить</button><button class="t-btn ghost" id="pomo-reset">⟲ Сброс</button>`}
    </div>
    <div class="timer-global-note">Сигнал прозвучит даже если закрыть приложение. Случайное закрытие шторки заблокировано во время работы.</div>
  </div>`;
}
function renderCarbBox(b){
  const c = timers.carb;
  const mine = c && sheetCtx && c.bk === blockKey(b) && c.dk === sheetCtx.dk;
  let inner;
  if(!mine || !c){
    inner = `<div class="carb-sub" style="margin-top:8px">После финиша спринта: 30–40 мин без углеводов.</div>
      <div class="timer-btns"><button class="t-btn" id="carb-start" style="background:var(--warn);color:#241503">⏱ Запустить таймер углеводов (35 мин)</button></div>`;

function renderBreathBox(b){
  const t = timers.breath;
  const mine = t && sheetCtx && t.bk === blockKey(b) && t.dk === sheetCtx.dk;
  let inner;
  if(!mine || !t){
    inner = `<div class="carb-sub" style="margin-top:8px">15 циклов «вдох 6 сек — выдох 12 сек» (~4.5 мин). Парасимпатика, откат кортизола перед сном.</div>

      <div class="carb-sub">Пульс ниже, голова тише. Дальше — сон-стек.</div>

function bindTimerButtons(b){
  const bk = blockKey(b), dk = sheetCtx ? sheetCtx.dk : null;
  const $id = id => document.getElementById(id);
  if($id("pomo-start")) $id("pomo-start").onclick = ()=>{ pomoStart(bk, dk); renderSheet(); };
  if($id("pomo-pause")) $id("pomo-pause").onclick = ()=>{ pomoPause(); renderSheet(); };
  if($id("pomo-resume")) $id("pomo-resume").onclick = ()=>{ pomoResume(); renderSheet(); };
  if($id("pomo-reset")) $id("pomo-reset").onclick = ()=>{ askConfirm("Сбросить помодоро-таймер?", ()=>{ pomoReset(); renderSheet(); }, "Сбросить"); };
  if($id("carb-start")) $id("carb-start").onclick = ()=>{ carbStart(bk, dk); renderSheet(); };
  if($id("carb-stop")) $id("carb-stop").onclick = ()=>{ carbStop(); renderSheet(); };
  if($id("breath-start")) $id("breath-start").onclick = ()=>{
    timers.breath = { startAt: Date.now(), cycles: 15, bk, dk, ended: false, doneCycles: 0, lastPhase: "" };
    saveTimers(); renderSheet();
    toast("Дыхание 6/12: вдох носом 6 сек — выдох 12 сек 🫁","ok");
  };
  if($id("breath-stop")) $id("breath-stop").onclick = ()=>{ timers.breath = null; saveTimers(); renderSheet(); };
}
function updateSheetTimers(){
  if(!sheetCtx) return;
  const p = timers.pomo;
  const arc = document.getElementById("pomo-arc"), tEl = document.getElementById("pomo-time");
  if(arc && tEl && p){
    const total = p.mode === "work" ? POMO_WORK : POMO_BREAK;
    const ms = p.running ? Math.max(0, p.endsAt - Date.now()) : p.remain;
    const C = 2*Math.PI*62;
    arc.style.strokeDashoffset = String(C * (1 - ms/total));
    tEl.textContent = fmtRemain(ms);
    const ring = document.getElementById("pomo-ring");
    if(ring) ring.classList.toggle("break", p.mode === "break");
    const ph = document.getElementById("pomo-phase");
    if(ph) ph.textContent = p.running ? (p.mode==="work" ? "работа — фокус" : "перерыв") : "пауза";
    const cyc = document.getElementById("pomo-cycles");
    if(cyc) cyc.textContent = `циклов: ${p.cycles||0}`;
  }
  const c = timers.carb, ct = document.getElementById("carb-time");
  if(ct && c && !c.alarmed) ct.textContent = fmtRemain(c.endsAt - Date.now());
  // breathing 6/12
  const bt = timers.breath;
  const circle = document.getElementById("breath-circle");
  if(circle && bt && !bt.ended){
    const el = (Date.now() - bt.startAt) / 1000;
    const cyc = Math.floor(el / 18);
    if(cyc >= bt.cycles){
      bt.ended = true; bt.doneCycles = bt.cycles; saveTimers();
      notify("🫁 Дыхание завершено", "15 циклов 6/12 сделано. Отбой-ритуал близко.");
      if(!document.hidden) beep(2);
      renderSheet();
      return;
    }
    const pos = el % 18;
    const inhale = pos < 6;
    const ph = document.getElementById("breath-phase");
    const cy = document.getElementById("breath-cycles");
    if(ph){
      ph.textContent = inhale ? `вдох 6 · ${6 - Math.floor(pos)}` : `выдох 12 · ${12 - Math.floor(pos - 6)}`;
      ph.style.color = inhale ? "var(--blue)" : "var(--muted)";
    }
    if(cy) cy.textContent = `цикл ${cyc + 1} / ${bt.cycles}`;
    circle.style.transition = `transform ${inhale ? 6 : 12}s cubic-bezier(.45,0,.55,1)`;
    const target = inhale ? 1.45 : 0.78;
    if(bt.lastPhase !== (inhale ? "in" : "out")){
      bt.lastPhase = inhale ? "in" : "out";
      circle.style.transform = `scale(${target})`;
    }
  }
}
function renderTimersEverywhere(){
  updateSheetTimers();
  updateTimerStrip();
}

  saveData(); renderBuilder();
}

/* ----- Week facts & AI prompt builder ----- */
function weekFacts(){
  const missed = {};
  let doneAll = 0, totAll = 0, waterSum = 0, waterDays = 0, cmSum = 0, cmDays = 0;
  for(let i = 6; i >= 0; i--){
    const d = addDays(today0(), -i);
    const dk = dateKey(d), dayKey = dayKeyOf(d);
    const blocks = effSchedule(dayKey, dk);
    const done = doneMap(dk);
    blocks.forEach(b=>{
      totAll++;
      if(done[blockKey(b)]) doneAll++;
      else if(blockStatus(dk, b) === "past") missed[b.title] = (missed[b.title]||0) + 1;
    });
    const w = (S_get(K.WATER, {})[dk]) || 0;
    if(w > 0){ waterSum += w; waterDays++; }
    const cc = S_get(K.CHECK, {})[dk];
    if(cc && Object.keys(cc).length){ cmSum += Object.keys(cc).length; cmDays++; }
  }
  const pct = totAll ? Math.round(doneAll/totAll*100) : 0;
  const topMissed = Object.entries(missed).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>`«${t}» — ${n} из 7`);
  return {
    pct,
    topMissed,
    waterAvg: waterDays ? (waterSum/waterDays/1000).toFixed(1) + " л" : "нет данных",
    cmAvg: cmDays ? (cmSum/cmDays).toFixed(1) + "/10" : "нет данных"
  };
}
function buildPrompt(goal, note){
  const f = weekFacts();
  return `Ты — мой личный планировщик дисциплины. Не давай советов и пояснений — верни ТОЛЬКО валидный JSON плана.
Схема JSON: {"week": {"monday"…"sunday": {"label","accent","schedule":[{"start","end","title","tag","callout"|null,"tools":[],"details"}]}}}; tag: routine|sport|study|food|care|sleep; tools: pomodoro|carb_timer|breath; время строго "06:00"; end > start; блоки дня не пересекаются.

ФАКТЫ МОЕЙ НЕДЕЛИ (последние 7 дней): выполнение блоков ${f.pct}%; чаще всего провалены: ${f.topMissed.join(", ") || "—"}; вода в среднем: ${f.waterAvg}; чек-минимум в среднем: ${f.cmAvg}.

ЗАДАЧА: ${goal}.${note ? " Уточнение от меня: " + note + "." : ""}
Сохрани философию плана: подъём 6:00 (±30 мин в выходные), отбой 21:30 край; спринты Ср и Сб (72 ч между); тяжёлые ноги только Пн (48 ч до спринтов); Вс — лёгкая качалка; в спринт-дни еда за 3 ч до и углеводы через 30–40 мин после; помодоро в домашке; сон и SPF неприкосновенны.

Верни ТОЛЬКО валидный JSON (всю неделю или только изменённые дни в той же схеме), без текста вокруг.

МОЙ ТЕКУЩИЙ JSON:
${JSON.stringify(DATA, null, 2)}`;
}

  const f = weekFacts();
  $("#pm-facts").innerHTML = `Выполнение: <b style="color:var(--accent)">${f.pct}%</b> · провалены: ${f.topMissed.length ? esc(f.topMissed.join(", ")) : "—"} · вода: ${esc(f.waterAvg)} · чек-мин: ${esc(f.cmAvg)}`;
